<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PromptCraft</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="popup-shell">
      <header class="popup-header">
        <div class="header-top">
          <h1>PromptCraft</h1>
          <div class="header-actions">
            <button id="languageToggleButton" class="primary-button language-toggle-button" type="button">中文</button>
            <button class="primary-button" type="submit" form="settingsForm">Save</button>
          </div>
        </div>
        <div class="header-switches">
          <label class="switch-row switch-row-compact">
            <span>Show floating button</span>
            <input id="showFloatingButtonInput" type="checkbox" role="switch" form="settingsForm">
          </label>
          <label id="currentSiteRow" class="switch-row switch-row-compact is-disabled" title="Site-level settings unavailable on this page">
            <span id="currentSiteHint">Hide on current site</span>
            <input id="disableCurrentSiteInput" type="checkbox" role="switch" disabled form="settingsForm">
          </label>
        </div>
      </header>

      <nav class="tab-bar">
        <button class="tab-button is-active" data-tab="provider" type="button">Provider Config</button>
        <button class="tab-button" data-tab="template" type="button">Optimize Template</button>
      </nav>

      <form id="settingsForm" class="settings-form">
        <div class="tab-content">
          <div class="tab-panel is-active" id="panel-provider">
            <label class="field">
              <span class="field-label">Optimize for</span>
              <select id="optimizationGoalSelect"></select>
              <span class="field-hint">Custom template is only used when Custom Template is selected.</span>
            </label>

            <label class="field">
              <span class="field-label">Provider</span>
              <select id="providerSelect"></select>
            </label>

            <label class="field">
              <span id="apiKeyLabel" class="field-label">OpenAI API Key</span>
              <div class="api-key-row">
                <input id="apiKeyInput" type="password" autocomplete="off" placeholder="sk-..." spellcheck="false">
                <button id="toggleApiKeyButton" class="icon-button" type="button" aria-label="Show API Key" title="Show API Key">👁</button>
              </div>
              <span id="apiKeyHint" class="field-hint">API Key is stored locally. Only sent to the selected provider.</span>
            </label>

            <label class="field">
              <span class="field-label">Model (manual input supported)</span>
              <input id="modelInput" list="modelPresetList" autocomplete="off" spellcheck="false">
              <datalist id="modelPresetList"></datalist>
              <span id="modelHint" class="field-hint">Model presets may change. Enter a valid model ID if the call fails.</span>
            </label>

            <div class="actions test-actions">
              <button id="testConnectionButton" class="secondary-button" type="button">Test Connection</button>
              <span id="testConnectionStatus" class="test-status"></span>
            </div>
          </div>

          <div class="tab-panel" id="panel-template">
            <label class="field">
              <span class="field-label">Prompt Optimization Template</span>
              <textarea id="promptTemplateInput" rows="12" spellcheck="false"></textarea>
              <span id="promptTemplateHint" class="field-hint">Template must include {originalPrompt} or {原始提示词内容}.</span>
            </label>

            <div class="actions">
              <button id="resetTemplateButton" class="secondary-button" type="button">Reset Template</button>
            </div>
          </div>
        </div>
      </form>

      <p id="statusText" class="status-text" aria-live="polite"></p>
    </main>

    <script src="../shared/messages.js"></script>
    <script src="../shared/provider-config.js"></script>
    <script src="../shared/optimization-goals.js"></script>
    <script src="../shared/config-utils.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
